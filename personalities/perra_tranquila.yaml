# Perra tranquila (calm dog): an adult dog beside your desk. She rests almost
# all the time, gets up for a while every so often, and plays at most once a
# day. This is the default personality and the base for the others: whatever
# another one leaves out is taken from here. Times carry the unit in the key
# name (_min, _s, _h); [a, b] pairs are ranges (a value between a and b is drawn).
name: perra_tranquila
description: Perra adulta y tranquila; duerme mucho, te mira de reojo, rara vez juega.
author: Wawi
version: 1

sleep:
  deep_median_min: 20          # deep nap: median length (lognormal)
  deep_sigma: 0.4              # how much it varies around the median
  deep_min_min: 15             # clamped between these bounds
  deep_max_min: 45
  doze_in_min: [2, 8]          # light doze before falling fully asleep
  doze_between_min: [1, 5]     # light doze between deep naps
  lie_back_down: 0.4           # after lifting her head, chance of lying back down
  latency_after_activity: 0.6  # just active and you nearby: falls asleep sooner (x)

wake:
  head_lift_s: [3, 10]         # lifts her head and looks around
  stretch: 0.7                 # when getting up: stretches
  shake: 0.3                   # and shakes herself
  walk: 0.25                   # and moves somewhere else (near you)

rest:
  minutes: [10, 20]            # awake and lying down, alert
  after_active_min: [3, 8]     # rest after moving around
  glance_every_min: [3, 10]    # a glance at you
  glance_s: [1, 3]
  gesture_every_min: [10, 20]  # a yawn, a scratch, settling in

active:
  chance: 0.7                  # when a rest ends, chance of getting up (x rhythm)
  minutes: [3, 7]
  something_every_s: [30, 90]  # sniffing, looking around, wagging her tail…

habituation:
  drop: 0.5                    # each time the same thing happens, novelty is multiplied by this
  recover_min: 10              # and recovers with this time constant
  threshold: 0.3               # below this she doesn't even react
  ear_flick_every_s: 120       # in deep sleep: just an ear flick, at most this often

greeting:
  look_after_min: 5            # back after 5 min: looks at you and wags her tail
  get_up_after_min: 30         # after 30 min: gets up
  full_after_min: 120          # after 2 h: full welcome
  look_wag_s: 3
  get_up_wag_s: [5, 10]
  full_s: [10, 20]

rhythm:                        # time-of-day multipliers (active: chance of getting up, sleep: nap length)
  morning_hours: [8, 10]
  morning_active: 2.0
  morning_sleep: 0.85
  siesta_hours: [12, 16]
  siesta_active: 0.6
  siesta_sleep: 1.15
  evening_hours: [17, 22]
  evening_active: 2.0
  evening_sleep: 0.85
  night_active: 0.1            # night is as defined in pet.rhythm
  night_sleep: 1.4
  night_rest: 0.4
  alone_active: 0.3            # nobody at the Mac
  alone_rest: 0.6

play:
  per_day: 1                   # zoomies: at most this many per day
  cooldown_h: 8
  chance: 0.3                  # when there is a reason (you came back, or she rested a long time)
  evening_boost: 2.0
  after_rest_min: 60
  seconds: [5, 20]

requests:                      # asking for water, food or play
  every_h: [1, 3]
  tries: [2, 3]
  between_min: [1, 3]

context:                       # gestures based on the frontmost app
  every_min: [30, 60]
  laptop_chance: 0.1

desktop:
  top_weight: 0.5              # window tops vs the floor (1.0): less climbing
  same_level_weight: 1.5
  near_owner: 1.0              # how strongly she prefers lying down near you
  cover_every_min: 10
