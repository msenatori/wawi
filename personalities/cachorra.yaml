# Cachorra (puppy): a young dog. Shorter naps, gets up more often, plays up to
# three times a day. Anything not set here comes from perra_tranquila.
name: cachorra
description: Perra joven; siestas cortas, más ratos activa, juega hasta 3 veces por día.
author: Wawi
version: 1

sleep:
  deep_median_min: 14
  deep_min_min: 10
  deep_max_min: 35
  lie_back_down: 0.3

rest:
  minutes: [8, 16]
  glance_every_min: [2, 5]
  gesture_every_min: [6, 12]

active:
  chance: 0.85
  minutes: [4, 9]
  something_every_s: [20, 60]

play:
  per_day: 3
  cooldown_h: 2.5
  chance: 0.5
  after_rest_min: 30

context:
  every_min: [10, 20]

desktop:
  top_weight: 1.0
