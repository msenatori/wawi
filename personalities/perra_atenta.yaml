# Perra atenta (attentive dog): the same calm dog, a bit more awake. She rests
# longer with her eyes open and looks at you more often. Anything not set here
# comes from perra_tranquila.
name: perra_atenta
description: La perra tranquila, un poco más despierta y pendiente de vos.
author: Wawi
version: 1

sleep:
  lie_back_down: 0.3

rest:
  minutes: [12, 24]
  glance_every_min: [2, 6]
  gesture_every_min: [8, 16]

context:
  every_min: [20, 40]
